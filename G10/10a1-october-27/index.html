<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>10A1 October 27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Cover deck player. Each part is a copy of a source build in this folder, trimmed to the chosen slides
   (TEMP/_tools/trim.py) and run by its own engine; this page only goes from one part to the next with
   the paint wipe. */
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1b2326}
.bf{position:fixed;inset:0;width:100%;height:100%;border:0;visibility:hidden;background:#1b2326}
.bf.on{visibility:visible}
</style>
</head>
<body>
<script src="../../_shared/paint-wipe/paint-wipe.js"></script>
<script>
(function(){
  'use strict';

  /* ===== The deck: one part per source build, in teaching order =====
     src = the copy in this folder; n = how many slides it shows (teacher version). */
  var PARTS = [
    { src:'exam.html',        n:8, color:'#ffffff', label:'ESL Lessons',         sub:'G10 · Unit 13 · Exam-style question' },
    { src:'test-review.html', n:4, color:'#ffffff', label:'In-Class Activities', sub:'Unit 13 Test Review: Reading' },
    { src:'section-d.html',   n:2, color:'#ffffff', label:'ESL Lessons',         sub:'G10 · Unit 13 · Section D' }
  ];

  var TOTAL = 0, cur = 0;
  PARTS.forEach(function(P, k){ P.k = k; P.off = TOTAL; TOTAL += P.n; });

  function wipeBusy(){ return !!(window.PaintWipe && PaintWipe.busy); }

  PARTS.forEach(function(P){
    P.frame = document.createElement('iframe');
    P.frame.className = 'bf';
    P.frame.title = P.label + ' · ' + P.sub;
    P.frame.setAttribute('allow', 'autoplay; fullscreen');
    P.ready = new Promise(function(res){ P.frame.addEventListener('load', function(){ hook(P); res(P); }, { once:true }); });
    P.frame.src = P.src;
    document.body.appendChild(P.frame);
  });

  /* ---------- hook a loaded part ---------- */
  function hook(P){
    var w = P.frame.contentWindow, d = w.document;
    P.w = w; P.d = d;
    P.slides = [].slice.call(d.querySelectorAll('#stage section.slide'));
    P.idx = function(){ return P.slides.indexOf(d.querySelector('#stage section.slide.active')); };
    function atEnd(dir){ var i = P.idx(); return dir > 0 ? i === P.slides.length - 1 : i === 0; }

    /* Next / Back at the part's own last / first slide → next / previous part */
    w.addEventListener('click', function(e){
      if (wipeBusy() && e.isTrusted){ e.preventDefault(); e.stopImmediatePropagation(); return; }
      var t = e.target && e.target.closest && e.target.closest('#nextBtn,#prevBtn');
      if (!t || P !== PARTS[cur]) return;
      var dir = t.id === 'nextBtn' ? 1 : -1;
      if (atEnd(dir)){ e.preventDefault(); e.stopImmediatePropagation(); go(cur + dir, dir); }
    }, true);

    /* keys: if the build did nothing with the key (no DOM change) at its own first / last slide → next part */
    var mut = false, keyDir = 0, keyIdx = -1, sawDown = false;
    var mo = new MutationObserver(function(){ mut = true; });
    mo.observe(d.documentElement, { subtree:true, attributes:true, childList:true, characterData:true });
    function dirOf(e){
      if (e.ctrlKey || e.metaKey || e.altKey) return 0;
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') return 1;
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') return -1;
      return 0;
    }
    w.addEventListener('keydown', function(e){
      keyDir = 0; sawDown = true;
      if (wipeBusy()){ e.preventDefault(); e.stopImmediatePropagation(); return; }
      var t = e.target; if (t && t.closest && t.closest('input,textarea,select,[contenteditable]')) return;
      keyDir = dirOf(e);
      if (keyDir){ mo.takeRecords(); mut = false; keyIdx = P.idx(); }
    }, true);
    w.addEventListener('keydown', function(e){
      var dir = keyDir; keyDir = 0;
      if (!dir || P !== PARTS[cur]) return;
      if (mo.takeRecords().length) mut = true;
      if (!mut && P.idx() === keyIdx && atEnd(dir) && !overlayOn(P)) go(cur + dir, dir);
    });
    /* a quiz's end screen swallows Space / → before this page sees them: go on when the key is released —
       but not on the press that finished the quiz, so its score screen stays up */
    w.addEventListener('keyup', function(e){
      var saw = sawDown; sawDown = false;
      if (wipeBusy()){ e.preventDefault(); e.stopImmediatePropagation(); return; }
      if (saw || P !== PARTS[cur] || dirOf(e) <= 0 || !atEnd(1)) return;
      if (P.qzDoneAt && Date.now() - P.qzDoneAt > 1000 && !overlayOn(P)) go(cur + 1, 1);
    }, true);
    w.addEventListener('keypress', function(e){ if (wipeBusy()){ e.preventDefault(); e.stopImmediatePropagation(); } }, true);

    /* deck numbers in the counter; Next / Back stay usable at the part's own ends */
    var sl = new MutationObserver(function(){
      var i = P.idx(), qd = i >= 0 && P.slides[i].classList.contains('qz-done');
      P.qzDoneAt = qd ? (P.qzDoneAt || Date.now()) : 0;
      if (P === PARTS[cur]) sync();
    });
    P.slides.forEach(function(s){ sl.observe(s, { attributes:true, attributeFilter:['class'] }); });
    ['counter', 'prevBtn', 'nextBtn'].forEach(function(id){
      var el = d.getElementById(id); if (!el) return;
      new MutationObserver(function(){ if (P === PARTS[cur]) sync(); })
        .observe(el, { attributes:true, attributeFilter:['disabled'], childList:true, characterData:true, subtree:true });
    });
  }

  function overlayOn(P){
    var d = P.d;
    try { if (P.w.gamify && P.w.gamify.isOn()) return true; } catch (x) {}
    if (d.getElementById('startGate')) return true;
    var c = d.getElementById('contents'); if (c && c.classList.contains('open')) return true;
    return !!d.querySelector('.lxScreen.on,#blackout.on,#whiteout.on,#zoomLayer.on');
  }

  function sync(){
    var P = PARTS[cur]; if (!P || !P.d) return;
    var d = P.d, i = Math.max(0, P.idx()), c = d.getElementById('counter'),
        txt = (P.off + i + 1) + ' / ' + TOTAL;
    if (c && c.textContent !== txt) c.textContent = txt;
    var pb = d.getElementById('prevBtn'), nb = d.getElementById('nextBtn'),
        first = cur === 0 && i === 0, last = cur === PARTS.length - 1 && i === P.slides.length - 1;
    if (pb && pb.disabled !== first) pb.disabled = first;
    if (nb && nb.disabled !== last) nb.disabled = last;
  }

  /* the player's own click inside a part: clear any text selection and pair the click with a pointerdown,
     so the build's "highlighting is not a click" guard lets it through */
  function press(P, el){
    if (!el) return;
    try { P.w.getSelection().removeAllRanges(); } catch (x) {}
    try { el.dispatchEvent(new P.w.PointerEvent('pointerdown', { bubbles:true, cancelable:true, button:0, isPrimary:true })); } catch (x) {}
    el.click();
  }
  /* put a part on its first / last slide through its own Contents list */
  function showSlide(P, i){
    if (P.idx() === i) return;
    var d = P.d, li = d.querySelectorAll('#contentsList li')[i];
    if (!li){ press(P, d.getElementById('contentsBtn')); li = d.querySelectorAll('#contentsList li')[i]; }
    if (li) press(P, li);
    var c = d.getElementById('contents'); if (c) c.classList.remove('open');
  }

  /* ---------- go to part k (dir +1: its first slide, -1: its last slide) ---------- */
  function go(k, dir){
    if (k < 0 || k >= PARTS.length || wipeBusy()) return;
    var A = PARTS[cur], B = PARTS[k];
    PaintWipe.run({
      from: A.color, to: B.color, label: B.label, sub: B.sub,
      onCover: function(){
        return B.ready.then(function(){
          var g = B.d.getElementById('startGate'); if (g) press(B, g);
          show(k);
          showSlide(B, dir > 0 ? 0 : B.slides.length - 1);
          sync();
        });
      }
    }).then(focusPart);
  }

  function show(k){
    cur = k;
    PARTS.forEach(function(P, j){ P.frame.classList.toggle('on', j === k); });
    focusPart();
  }
  function focusPart(){ try { PARTS[cur].frame.focus(); PARTS[cur].w.focus(); } catch (x) {} }

  /* keys that land on this page (focus outside the part): hand them to the part */
  addEventListener('keydown', function(e){
    var P = PARTS[cur]; if (wipeBusy() || !P.d) return;
    e.preventDefault(); focusPart();
    (P.d.activeElement || P.d.body).dispatchEvent(new P.w.KeyboardEvent('keydown', { key:e.key, code:e.code, shiftKey:e.shiftKey, bubbles:true, cancelable:true }));
  });

  /* the paint-wipe label font, ready before the first wipe */
  try { document.fonts.load('700 40px "Source Serif 4"'); document.fonts.load('600 40px "Source Serif 4"'); } catch (x) {}

  PARTS[0].ready.then(function(){ show(0); sync(); });
})();
</script>
</body>
</html>
